name: XavPac TV build

on:
  push:
    branches:
      - xavpac-tv

jobs:
  tvos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build tvOS simulator
        run: |
          xcodebuild \
            -project XavPacTV.xcodeproj \
            -scheme XavPacTV \
            -sdk appletvsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
