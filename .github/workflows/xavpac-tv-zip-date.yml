name: XavPac TV - ZIP date pour Mac

on:
  workflow_dispatch:
  push:
    branches:
      - xavpac-tv-invites-20261014
    paths:
      - ".github/workflows/xavpac-tv-zip-date.yml"
      - "XavPacTV/**"
      - "XavPacTV.xcodeproj/**"

permissions:
  contents: read

jobs:
  preparer-fichier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: XavPacTV_PODIUM_15-10-2026_12h35
      PROJECT_TO_OPEN: 01_OUVRIR_XavPacTV_PODIUM_15-10-2026_12h35.xcodeproj
    steps:
      - name: Récupérer la version du podium
        uses: actions/checkout@v4
      - name: Créer un dossier et un projet Xcode bien datés
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/$VERSION"
          cp -R "XavPacTV" "dist/$VERSION/XavPacTV"
          cp -R "XavPacTV.xcodeproj" "dist/$VERSION/$PROJECT_TO_OPEN"
          cat > "dist/$VERSION/00_LIRE_EN_PREMIER_15-10-2026_12h35.txt" <<'TXT'
          XAVPAC TV - PODIUM DES APPROCHES
          VERSION : 15 OCTOBRE 2026 A 12H35
          
          C'EST LE DERNIER FICHIER A OUVRIR SUR LE MAC :
          01_OUVRIR_XavPacTV_PODIUM_15-10-2026_12h35.xcodeproj

          1. Décompresser le ZIP téléchargé depuis GitHub.
          2. Ouvrir le fichier ci-dessus sur le Mac avec Xcode.
          3. Dans Xcode : sélectionner le scheme XavPacTV.
          4. Choisir l'Apple TV « Salon Haut » comme destination.
          5. Vérifier la même équipe Apple dans Signing & Capabilities.
          6. Cliquer sur Run (triangle ▶).

          Ne pas ouvrir le dossier XavPacTV seul, ni les fichiers .swift.
          Ne pas chercher à lancer le ZIP directement sur l'Apple TV.
          Cette version est celle du PODIUM 2 - 1 - 3.
          La date/heure sont un repère de version, pas l'heure de l'installation.
          TXT
          test -f "dist/$VERSION/$PROJECT_TO_OPEN/project.pbxproj"
          test -f "dist/$VERSION/$PROJECT_TO_OPEN/xcshareddata/xcschemes/XavPacTV.xcscheme"
          test -f "dist/$VERSION/XavPacTV/ApproachPodiumView.swift"
          echo "Projet Xcode final :"
          find "dist/$VERSION" -maxdepth 2 -type f | head -30
      - name: Publier le fichier ZIP daté
        uses: actions/upload-artifact@v4
        with:
          name: XavPacTV_PODIUM_15-10-2026_12h35
          path: dist/XavPacTV_PODIUM_15-10-2026_12h35/
          if-no-files-found: error
          retention-days: 90
