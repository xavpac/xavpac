name: Validation Xcode Cloud

on:
  push:
    branches:
      - xavpac-tv-zero-mac

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck
      - name: Tests
        run: pnpm test
      - name: Next build
        run: pnpm build
      - name: Schemes
        run: xcodebuild -project XavPacTV.xcodeproj -list
      - name: tvOS build
        run: |
          xcodebuild \
            -project XavPacTV.xcodeproj \
            -scheme XavPacTV \
            -sdk appletvsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
