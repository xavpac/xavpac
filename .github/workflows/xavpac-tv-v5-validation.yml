name: Validation XavPac TV V5

on:
  push:
    branches:
      - xavpac-tv-v5-final2

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: tvOS build
        run: |
          xcodebuild \
            -project XavPacTV.xcodeproj \
            -scheme XavPacTV \
            -sdk appletvsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
