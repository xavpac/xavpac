name: XavPac TV zero-Mac validation

on:
  push:
    branches:
      - xavpac-tv-zero-mac

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - name: tvOS simulator
        run: |
          xcodebuild \
            -project XavPacTV.xcodeproj \
            -scheme XavPacTV \
            -sdk appletvsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
